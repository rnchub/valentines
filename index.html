<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="fade">HAII BABYY!! 💕</h1>
    <p class="fade" id="message">
      I think my February would be a lot brighter with you in it. Will you be my Valentine?
    </p>

   <div class="photo-container">
  <div class="photo-card">
    <img src="IMG_0478.jpeg" alt="Photo 1" class="gallery-photo">
    <p class="photo-caption">Our first adventure 💖</p>
  </div>
  <div class="photo-card">
    <img src="IMG_0415.jpeg" alt="Photo 2" class="gallery-photo">
    <p class="photo-caption">Best memories together 🌸</p>
  </div>
  <div class="photo-card">
    <img src="IMG_0528.png" alt="Photo 3" class="gallery-photo">
    <p class="photo-caption">Always us 💕</p>
  </div>
</div>


    <p id="response" class="fade"></p>
  </div>

  <div class="hearts"></div>
  <div class="side-decor left-decor"></div>
  <div class="side-decor right-decor"></div>

  <script>
    // Yes button behavior
    const yesBtn = document.getElementById("yes-btn");
    yesBtn.addEventListener("click", () => {
      const photos = document.querySelectorAll('.gallery-photo');
      const response = document.getElementById("response");
      const noBtn = document.getElementById("no-btn");

      // Remove No button
      if (noBtn) noBtn.remove();

      // Show pictures one by one
      photos.forEach((photo, i) => {
        setTimeout(() => {
          photo.style.display = "block";
          photo.parentElement.classList.add("pop"); // animate card
        }, i * 600);
      });

      // Show message after last photo
      setTimeout(() => {
        response.textContent = "YAY 🥹💞 THANKS BABYY!! I can’t wait to spend my valentine’s with you!!";
      }, photos.length * 600);
    });

    // No button behavior
    const noBtn = document.getElementById("no-btn");
    let noPressCount = 0;
    const noMessages = [
      "Are you sure? 🤔","Really? 😅","Come on... 💕","I’ll be sad 😢",
      "Think again! 😏","Please? 🥺","Still no? 😳","Don't be mean 😝",
      "Seriously? 😬","Pretty please? 🙏","I’m waiting 😭","C’mon now 😅",
      "No way! 😆","You can’t resist 😏","Last chance! 💖"
    ];

    noBtn.addEventListener('click', () => {
      if (noPressCount < 15) {
        noBtn.textContent = noMessages[noPressCount];
        noPressCount++;
      } else {
        noBtn.remove();
      }
    });

    // Floating hearts
    const heartsContainer = document.querySelector('.hearts');
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 500);
  </script>
</body>
</html>
