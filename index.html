<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <!--
    Quick instructions:
    - Put your photos in an images/ folder named photo1.jpg, photo2.jpg, photo3.jpg (or change the <img src> paths).
    - To personalize the name via URL: open index.html?name=Emma and it will show "For Emma".
    - Edit the <p class="love-note"> text below to your personal message.
    - Open index.html locally or host on GitHub Pages / Netlify to share.
  -->
</head>
<body>
  <div class="page-wrap">
    <header class="site-header">
      <div class="header-left">
        <h2 class="to">For <span class="her-name">JMy Baby</span></h2>
        <small class="subhead">A little page made just for you</small>
      </div>
      <div class="header-right">
        <span class="heart-badge" aria-hidden="true">💌</span>
      </div>
    </header>

    <main class="card">
      <section class="photos">
        <div class="photo-stack" aria-hidden="true">
          <img src="IMG_0415.jpeg alt="photo 1" class="photo photo-1" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1200&auto=format&fit=crop&crop=faces'">
          <img src="IMG_0478.jpeg" alt="photo 2" class="photo photo-2" onerror="this.src='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1200&auto=format&fit=crop&crop=faces'">
          <img src="IMG_0528.png" alt="photo 3" class="photo photo-3" onerror="this.src='https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=1200&auto=format&fit=crop&crop=faces'">
        </div>
        <p class="love-note">Every moment with you feels like sunshine — would you be my Valentine?</p>
      </section>

      <section class="message">
        <h1 class="title">Will you be my Valentine?</h1>
        <p class="lead">I made this just for you — a few memories, a question, and all my heart.</p>

        <div class="cta-row">
          <button id="yesBtn" class="cta yes">Yes, with all my heart ❤️</button>
          <button id="noBtn" class="cta no">Tell me later ☺️</button>
        </div>

        <div class="extra">
          <p class="small">P.S. I love you — more than I can say.</p>
        </div>
      </section>
    </main>

    <section class="gallery">
      <h3>Memories</h3>
      <div class="grid">
        <figure><img src="images/photo1.jpg" alt="memory 1" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop&crop=faces'"></figure>
        <figure><img src="images/photo2.jpg" alt="memory 2" onerror="this.src='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=800&auto=format&fit=crop&crop=faces'"></figure>
        <figure><img src="images/photo3.jpg" alt="memory 3" onerror="this.src='https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=800&auto=format&fit=crop&crop=faces'"></figure>
      </div>
    </section>

    <footer class="site-footer">
      <small>Made with lots of ❤️</small>
    </footer>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
