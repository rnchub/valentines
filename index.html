<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!--
    Instructions:
    - Replace the sample images in the <img> tags (photo1.jpg, photo2.jpg, photo3.jpg)
      with your own photos in the images/ folder or change the src to any URL.
    - Edit the <h1> below to add her name: e.g., "For Emma" or remove if you prefer.
    - Open index.html in your browser to preview. To share, upload the whole folder to GitHub Pages or Netlify.
  -->
</head>
<body>
  <main class="page">
    <header class="top">
      <h2 class="to">For <span class="her-name">[Her Name]</span></h2>
    </header>

    <section class="card">
      <div class="left">
        <div class="photo-stack">
          <!-- Replace these src URLs with your own images: images/photo1.jpg etc. -->
          <img src="IMG_0528.png" alt="Us - photo 1" class="photo photo-1" onerror="this.src='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1200&auto=format&fit=crop&crop=faces'">
          <img src="IMG_0528.png" alt="Us - photo 2" class="photo photo-2" onerror="this.src='https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=1200&auto=format&fit=crop&crop=faces'">
          <img src="IMG_0528.png" alt="Us - photo 3" class="photo photo-3" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1200&auto=format&fit=crop&crop=faces'">
        </div>
        <p class="note">You make my days sweeter. I couldn't imagine doing life without your smile.</p>
      </div>

      <div class="right">
        <h1 class="title">Will you be my Valentine?</h1>
        <p class="subtitle">I picked out some memories and put them here — and one big question.</p>

        <div class="actions">
          <button id="revealBtn" class="btn primary">Open the card</button>
        </div>

        <div id="reveal" class="reveal" aria-hidden="true">
          <p class="reveal-text">Would you make me the happiest by being my Valentine?</p>
          <div class="reveal-actions">
            <button id="yesBtn" class="btn yes">Yes, of course! ❤️</button>
            <button id="noBtn" class="btn no">Tell me later</button>
          </div>
          <p class="small">P.S. I love you.</p>
        </div>
      </div>
    </section>

    <section class="gallery">
      <h3>Memories</h3>
      <div class="grid">
        <figure>
          <img src="IMG_0478.jpeg" alt="memory 1" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop&crop=faces'">
        </figure>
        <figure>
          <img src="IMG_0415.jpeg" alt="memory 2" onerror="this.src='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=800&auto=format&fit=crop&crop=faces'">
        </figure>
        <figure>
          <img src="IMG_0528.png" alt="memory 3" onerror="this.src='https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=800&auto=format&fit=crop&crop=faces'">
        </figure>
      </div>
    </section>

    <footer class="foot">
      <small>Made with a lots of ❤️</small>
    </footer>
  </main>

  <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
